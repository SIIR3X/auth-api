services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-auth-net

  redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-cache-net

  mailpit:
    image: axllent/mailpit:v1.31@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-mail-net

  nats:
    image: nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    # JetStream stores the user events the outbox relay publishes. Overriding
    # the command drops the image's config file,
    # so monitoring (probed by the healthcheck) is re-enabled explicitly.
    # Authenticated like production: every suite connects with the token of
    # TEST_NATS_URL, so a client that drops it fails the whole gate.
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--auth", "auth-api-test-token"]
    ports:
      - "127.0.0.1:4224:4222"
      - "127.0.0.1:8224:8222"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-nats-net

networks:
  test-auth-net:
    driver: bridge
  test-cache-net:
    driver: bridge
  test-mail-net:
    driver: bridge
  test-nats-net:
    driver: bridge
