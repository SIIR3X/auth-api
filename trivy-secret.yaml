# Trivy secret scan of the repository (scripts/infra-check.sh, CHECKS=hygiene).
# Default rules, plus the files that hold keys committed on purpose. Each entry
# is one exact path: a new key anywhere else still fails the scan.
allow-rules:
  - id: development-jwt-key
    description: The development stack's JWT key pair, never used outside local development
    path: '^\.env\.dev$'
  - id: benchmark-jwt-key
    description: Fixed JWT key pair of the benchmark harness
    path: '^src/bin/bench_support\.rs$'
  - id: fuzzing-jwt-key
    description: Fixed JWT key pair signing the tokens of the fuzz targets
    path: '^src/fuzzing\.rs$'
