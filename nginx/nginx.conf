# Reverse proxy in front of auth-api: TLS termination, volumetric rate limits,
# and the security headers of every response - including the ones nginx
# generates itself (429, 502, 405), which never reach the application.
#
# The application keeps its own per-client limits in Redis
# (RATE_LIMIT_RPM, RATE_LIMIT_AUTH_RPM). Nginx absorbs floods before they
# reach it; keep the nginx limits above the application ones so clients see
# the application's 429 (with its Retry-After) rather than the gateway's.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=20r/m;

upstream auth_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # -------------------------------------------------------------------------
    # TLS
    # -------------------------------------------------------------------------

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # No OCSP stapling: Let's Encrypt stopped operating OCSP responders in
    # 2025, and stapling an unavailable responder only produces errors.

    server_tokens off;

    # -------------------------------------------------------------------------
    # Security headers - one source of truth
    # -------------------------------------------------------------------------
    # The application sets the same headers for direct access; its copies are
    # hidden here so a proxied response never carries two conflicting values.
    # Values match the application's, except HSTS which adds `preload`: that
    # decision belongs to whoever owns the domain's TLS edge.

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Powered-By;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"                                always;
    add_header X-Frame-Options           "DENY"                                                                        always;
    add_header X-Content-Type-Options    "nosniff"                                                                     always;
    add_header X-XSS-Protection          "0"                                                                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                                             always;
    add_header Content-Security-Policy   "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"                                    always;

    # -------------------------------------------------------------------------
    # Request limits
    # -------------------------------------------------------------------------

    client_max_body_size  64k;
    client_body_timeout   10s;
    client_header_timeout 10s;

    if ($request_method !~ ^(GET|POST|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Shared proxy settings (inherited by every location below).
    proxy_http_version    1.1;
    proxy_set_header      Connection        "";
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    # Overwrite rather than append: the client cannot inject hops the
    # application would then trust.
    proxy_set_header      X-Forwarded-For   $remote_addr;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    # -------------------------------------------------------------------------
    # Public keys - must stay reachable
    # -------------------------------------------------------------------------
    # Exact match: wins over the hidden-file rule below, which would otherwise
    # deny every /.well-known path and leave resource servers unable to verify
    # tokens. The application sets its own Cache-Control for this document.

    location = /.well-known/jwks.json {
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }

        proxy_pass         http://auth_api;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Hidden files (.env, .git, ...).
    location ~ /\. {
        deny all;
    }

    # -------------------------------------------------------------------------
    # Credential-bearing routes - strict rate limit
    # -------------------------------------------------------------------------
    # Anchored on both ends: `/auth/login-anything` is not a login route.
    # Logout stays in the general zone so an exhausted auth budget never
    # prevents someone from ending their session.

    location ~ ^/auth/(register|login|refresh|verify-email|forgot-password|reset-password|two-factor/[a-z-]+|device|device/token|device/verify|authorize|authorize/token)$ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://auth_api;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location ~ ^/users/me/(reauth|email/(start|verify-current|submit|confirm))$ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://auth_api;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # Everything else - general rate limit
    # -------------------------------------------------------------------------

    location / {
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://auth_api;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
