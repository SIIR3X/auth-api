# Reverse proxy in front of auth-api: TLS termination, volumetric rate limits,
# and the security headers of every response - including the ones nginx
# generates itself (429, 502, 405), which never reach the application.
#
# The application keeps its own per-client limits in Redis
# (RATE_LIMIT_RPM=300, RATE_LIMIT_AUTH_RPM=20). Nginx absorbs floods before they
# reach it at twice those rates, so a client under its limit never meets nginx's
# 429 and an abusive one gets the application's (with its Retry-After).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=600r/m;

# The requests the API holds to its strict bucket (credentials, one-time codes,
# password guesses, OAuth flows): keyed by client address, every other request
# by nothing, and an empty key is not limited. Method and path both count:
# `DELETE /users/me` takes a password, `GET /users/me` does not. The first
# matching pattern wins. A test (src/openapi.rs) checks this list against the
# API's routers, so the two cannot drift apart.
map "$request_method $uri" $auth_limit_key {
    default                                          "";
    "~^[A-Z]+ /auth/logout$"                         "";
    "~^[A-Z]+ /auth/"                                $binary_remote_addr;
    "~^[A-Z]+ /oauth/(token|introspect|revoke)$"     "";
    "~^[A-Z]+ /oauth/"                               $binary_remote_addr;
    "~^[A-Z]+ /users/me/(reauth|export|username|password)$"                         $binary_remote_addr;
    "~^[A-Z]+ /users/me/email/(start|verify-current|submit|confirm)$"               $binary_remote_addr;
    "~^[A-Z]+ /users/me/two-factor/(totp/setup|email/setup|recovery-codes)$"        $binary_remote_addr;
    "~^DELETE /users/me(/sessions(/[^/]+)?|/passkeys/[^/]+|/external-identities/[^/]+|/two-factor/(totp|email)/[^/]+)?$" $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=api_auth:10m rate=40r/m;

# The path as logged: codes carried by the URL (a device's user code, an
# authorization request id) are masked, as the API masks them in its own logs.
map $uri $auth_api_log_uri {
    default                                  $uri;
    "~^/oauth/device/[^/]+$"                 "/oauth/device/{user_code}";
    "~^/oauth/authorization-requests/[^/]+"  "/oauth/authorization-requests/{id}";
}

# One line per client request, correlated with the API's logs by request_id.
log_format auth_api_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","client":"$remote_addr",'
    '"method":"$request_method","uri":"$auth_api_log_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_duration":"$upstream_response_time","user_agent":"$http_user_agent"}';

# The API instances of docker-compose.api.yml. An instance that refuses or
# times out is skipped for 10 s. Profile L: add 127.0.0.1:3003 and 3004.
upstream auth_api {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # -------------------------------------------------------------------------
    # TLS
    # -------------------------------------------------------------------------

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # No OCSP stapling: Let's Encrypt stopped operating OCSP responders in
    # 2025, and stapling an unavailable responder only produces errors.

    server_tokens off;

    access_log /var/log/nginx/auth-api.access.log auth_api_json;
    error_log  /var/log/nginx/auth-api.error.log warn;

    # -------------------------------------------------------------------------
    # Security headers - one source of truth
    # -------------------------------------------------------------------------
    # The application sets the same headers for direct access; its copies are
    # hidden here so a proxied response never carries two conflicting values.
    # Values match the application's, except HSTS which adds `preload`: that
    # decision belongs to whoever owns the domain's TLS edge.

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Powered-By;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"                                always;
    add_header X-Frame-Options           "DENY"                                                                        always;
    add_header X-Content-Type-Options    "nosniff"                                                                     always;
    add_header X-XSS-Protection          "0"                                                                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                                             always;
    add_header Content-Security-Policy   "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"                                    always;

    # -------------------------------------------------------------------------
    # Request limits
    # -------------------------------------------------------------------------

    client_max_body_size  64k;
    client_body_timeout   10s;
    client_header_timeout 10s;

    # HEAD is served as GET by the API; uptime probes use it. PUT replaces
    # roles' permissions, clients and webhooks in the administration.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Shared proxy settings (inherited by every location below).
    proxy_http_version    1.1;
    proxy_set_header      Connection        "";
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    # Overwrite rather than append: the client cannot inject hops the
    # application would then trust.
    proxy_set_header      X-Forwarded-For   $remote_addr;
    proxy_set_header      X-Forwarded-Proto $scheme;
    # The API keeps this identifier (it matches its format) in every log line.
    proxy_set_header      X-Request-Id      $request_id;
    proxy_connect_timeout 5s;
    # Above the API's own 30-second request timeout (Argon2 queueing during a
    # sign-in storm): nginx never gives up on a request the API still completes.
    proxy_read_timeout    35s;
    proxy_send_timeout    35s;

    # An instance that refuses the connection (restarting, stopped) or fails
    # before answering: the request goes to the other one. nginx never resends a
    # POST, PATCH or DELETE that already reached an instance.
    proxy_next_upstream         error timeout http_502 http_503;
    proxy_next_upstream_tries   2;
    proxy_next_upstream_timeout 10s;

    # -------------------------------------------------------------------------
    # Discovery documents - must stay reachable
    # -------------------------------------------------------------------------
    # Discovery documents (JWKS, OAuth and OpenID Connect metadata): a prefix
    # match that wins over the hidden-file rule below, which would otherwise
    # deny every /.well-known path. The application sets their Cache-Control.

    location ^~ /.well-known/ {
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }

        proxy_pass         http://auth_api;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Probes for uptime monitoring: short timeouts, not logged.
    location ~ ^/(live|ready|health)$ {
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;
        access_log off;

        proxy_pass         http://auth_api;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    # Hidden files (.env, .git, ...).
    location ~ /\. {
        deny all;
    }

    # -------------------------------------------------------------------------
    # Every other route
    # -------------------------------------------------------------------------

    # Every request spends the general zone; the strict ones spend the strict
    # zone too ($auth_limit_key above).
    location / {
        limit_req zone=api_general burst=50 nodelay;
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://auth_api;
    }
}
