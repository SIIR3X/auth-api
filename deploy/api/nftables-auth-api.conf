# Only nginx (and root, for the rolling update's readiness checks) reaches the
# API instances on the API VPS. Docker publishes them on 127.0.0.1:3001-3004,
# and the application trusts X-Forwarded-For from the address those
# connections arrive with: without this rule, any other process on the host
# could forge a client address and bypass the per-address limits.
#
# Install (docs/deploy/api/deployment.md):
#   sudo install -m 644 deploy/api/nftables-auth-api.conf /etc/nftables.d/auth-api.conf
#   echo 'include "/etc/nftables.d/*.conf"' | sudo tee -a /etc/nftables.conf
#   sudo systemctl enable --now nftables && sudo nft -f /etc/nftables.conf
# Check: `sudo -u nobody curl -s 127.0.0.1:3001/live` is refused, while
# `sudo curl -fsS 127.0.0.1:3001/live` and `curl -fsS https://<host>/live` answer.
# www-data is the user nginx workers run as on Debian.

table inet auth_api_local {
    chain output {
        type filter hook output priority 0; policy accept;
        oifname "lo" tcp dport 3001-3004 meta skuid != { 0, "www-data" } reject with tcp reset
    }
}
