# Alertmanager of the monitoring host. Replace the SMTP relay, the addresses and
# the webhook with your own; test the route with:
#   amtool --alertmanager.url=http://127.0.0.1:9093 alert add Test severity=warning

global:
  smtp_smarthost: smtp.example.com:587
  smtp_from: alerts@example.com
  smtp_auth_username: alerts@example.com
  smtp_auth_password_file: /etc/alertmanager/smtp_password
  smtp_require_tls: true

route:
  receiver: operators
  group_by: [alertname, vps]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: operators-urgent
      repeat_interval: 1h
    # The dead man's switch goes to a service that pages when it stops arriving.
    - matchers: [alertname="Watchdog"]
      receiver: deadmans-switch
      repeat_interval: 5m

receivers:
  - name: operators
    email_configs:
      - to: ops@example.com
  - name: operators-urgent
    email_configs:
      - to: ops@example.com
    webhook_configs:
      - url: https://hooks.example.com/auth-api-urgent
  - name: deadmans-switch
    webhook_configs:
      - url: https://deadmans-switch.example.com/ping/auth-api

# While the public probe fails, the alerts it explains stay quiet.
inhibit_rules:
  - source_matchers: [alertname="AuthApiPublicProbeFailing"]
    target_matchers: [alertname=~"AuthApiHigh5xxRate|AuthApiSlowTokenPaths"]
  - source_matchers: [alertname="HostDown"]
    target_matchers: [severity="warning"]
    equal: [vps]
