# WAL archiving to pgBackRest, profiles M and L. Copy to
# /etc/postgresql/17/main/conf.d/auth-api-pitr.conf next to auth-api.conf, then
# restart PostgreSQL and create the stanza (docs/deploy/database/deployment.md,
# section 4.7).
archive_mode = on
archive_command = 'pgbackrest --stanza=auth_api archive-push %p'
archive_timeout = 60
wal_level = replica
max_wal_senders = 3
