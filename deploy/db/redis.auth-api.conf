# Redis settings for auth-api on the DB VPS, profile M. Append an include to the
# packaged configuration, then restart Redis:
#   echo 'include /etc/redis/auth-api.conf' | sudo tee -a /etc/redis/redis.conf
# Other profiles: maxmemory 256mb (S), 4gb (L).

bind 10.0.0.2
protected-mode yes
port 6379

# Access control: the default user is disabled and the API authenticates as
# auth_api, which cannot run administrative or dangerous commands (FLUSHALL,
# CONFIG, KEYS, DEBUG, MONITOR...). Users are defined in the ACL file, with
# password hashes only (docs/deploy/database/deployment.md, section 3).
aclfile /etc/redis/users.acl

# Memory. Nothing is ever evicted: attempt budgets, revocation lists and
# second-factor challenges must not vanish to make room, since evicting a budget
# resets it. When memory is full, writes fail, the API answers 503, and the
# memory alert has fired long before.
maxmemory 1gb
maxmemory-policy noeviction

# Persistence: revoked access tokens and attempt budgets survive a restart.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

# Connections.
tcp-keepalive 60
timeout 0
maxclients 1024
