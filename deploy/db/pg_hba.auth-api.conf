# Access rules of the auth-api database, appended to
# /etc/postgresql/17/main/pg_hba.conf (docs/deploy/database/deployment.md,
# section 2.2). Only the API VPS, through its WireGuard address, and only with
# a password (SCRAM): no `trust`, no wider network. Rules are read top down:
# nothing above them may grant more.
#
# Where the tunnel is not the trust boundary, write `hostssl` instead of `host`
# and add `sslmode=verify-full` to both connection URLs.

# TYPE  DATABASE    USER              ADDRESS        METHOD
host    auth_api    auth_api          10.0.0.1/32    scram-sha-256
host    auth_api    auth_api_owner    10.0.0.1/32    scram-sha-256
