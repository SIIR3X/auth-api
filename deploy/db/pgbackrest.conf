# pgBackRest for auth-api, profiles M and L: continuous WAL archiving for
# point-in-time recovery, an encrypted repository, a full backup every week and a
# differential one every day, two full backups kept (about two weeks of history).
# Copy to /etc/pgbackrest/pgbackrest.conf, owner postgres, mode 600: it holds
# the cipher passphrase, set from pass (docs/deploy/database/deployment.md,
# section 4.7). Nobody else on the host may read it.

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=REPLACE_WITH_pass_prod/auth-api/pgbackrest-cipher-pass
compress-type=zst
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail
# Offsite copy: a server lost with its disk takes repo1 with it. Uncomment and
# fill a second repository; pgBackRest pushes every backup and WAL segment to
# both. Its key and secret come from pass as well.
# repo2-type=s3
# repo2-path=/auth-api
# repo2-s3-bucket=REPLACE_WITH_bucket
# repo2-s3-endpoint=REPLACE_WITH_endpoint
# repo2-s3-region=REPLACE_WITH_region
# repo2-s3-key=REPLACE_WITH_pass_prod/auth-api/pgbackrest-s3-key
# repo2-s3-key-secret=REPLACE_WITH_pass_prod/auth-api/pgbackrest-s3-secret
# repo2-retention-full=4
# repo2-cipher-type=aes-256-cbc
# repo2-cipher-pass=REPLACE_WITH_pass_prod/auth-api/pgbackrest-cipher-pass

[auth_api]
pg1-path=/var/lib/postgresql/17/main
