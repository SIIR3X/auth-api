# PostgreSQL settings for auth-api, profile M: a DB VPS with 16 GB of RAM, 8 GB
# of it for PostgreSQL. Copy to /etc/postgresql/17/main/conf.d/auth-api.conf
# (Debian's postgresql.conf includes that directory), then restart PostgreSQL.
# Other profiles: see the comments; sizing rules in
# docs/deploy/guides/operations.md, section 9.

# Network: the WireGuard address only.
listen_addresses = '10.0.0.2'
password_encryption = 'scram-sha-256'

# Connections: every API instance's pool (profile M: 2 x 12), the one-off
# commands, maintenance and the exporter. Profile S: 50, L: 100.
max_connections = 60

# Memory: a quarter of PostgreSQL's RAM in shared buffers, three quarters as
# the planner's cache estimate. Profile S: 512MB / 1536MB, L: 8GB / 24GB.
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 16MB

# Storage: SSD.
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL and checkpoints.
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# Query statistics, read by the exporter and the cache check of the guide.
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on

# Logs: slow statements, lock waits, long autovacuum runs and checkpoints.
log_min_duration_statement = 250ms
log_lock_waits = on
log_autovacuum_min_duration = 1s
log_checkpoints = on
log_line_prefix = '%m [%p] %q%u@%d '
