# Kernel settings for the DB VPS (PostgreSQL and Redis). Copy to
# /etc/sysctl.d/90-auth-api.conf, then run `sudo sysctl --system`.

# Redis forks to rewrite its append-only file: without overcommit, the fork can
# fail on a busy host and persistence stops.
vm.overcommit_memory = 1

# Keep the databases in memory; swap only to avoid an out-of-memory kill.
vm.swappiness = 1
