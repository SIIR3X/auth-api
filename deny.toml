[graph]
# Only the features actually built: `all-features` would pull sqlx-mysql and
# its `rsa` dependency (RUSTSEC-2023-0071) into the graph, although neither is
# ever compiled for this service.
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
# Path dependencies inside this repository (the test harness) carry no
# version; they are never published.
allow-wildcard-paths = true
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Reviewed, accepted duplicate versions. They stem from sqlx, proptest and
# p256 pinning older rand/getrandom generations, and from the Windows platform
# stub crates (build-time only, never used on the Linux runtime target). Listed by
# name so that any *new*, unexpected duplicate still surfaces as a warning.
skip = [
  { crate = "cpufeatures" },
  { crate = "getrandom" },
  { crate = "hashbrown" },
  { crate = "ipnetwork" },
  { crate = "r-efi" },
  { crate = "rand" },
  { crate = "rand_chacha" },
  { crate = "rand_core" },
  { crate = "redox_syscall" },
  { crate = "thiserror" },
  { crate = "thiserror-impl" },
  { crate = "webpki-roots" },
  { crate = "windows-sys" },
  { crate = "windows-targets" },
  { crate = "windows_aarch64_gnullvm" },
  { crate = "windows_aarch64_msvc" },
  { crate = "windows_i686_gnu" },
  { crate = "windows_i686_msvc" },
  { crate = "windows_x86_64_gnu" },
  { crate = "windows_x86_64_gnullvm" },
  { crate = "windows_x86_64_msvc" },
]
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  # MIT without the attribution clause; pulled by the test harness (jsonschema).
  "MIT-0",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
exceptions = []

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
