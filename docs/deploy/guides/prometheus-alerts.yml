# Prometheus alerting rules for the auth API.
#
# Install on the API VPS host Prometheus:
#   sudo cp prometheus-alerts.yml /etc/prometheus/rules/auth-api.yml
#   # then in prometheus.yml:  rule_files: ["/etc/prometheus/rules/*.yml"]
#   sudo systemctl reload prometheus
#
# Thresholds are starting points for a single-instance deployment; tune them
# against real traffic.

groups:
  - name: auth-api
    rules:
      - alert: AuthApiDown
        expr: up{job="auth-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "auth-api metrics endpoint is unreachable"
          description: >-
            Prometheus cannot scrape 127.0.0.1:9464 for 2 minutes. Check
            `docker compose -f docker-compose.api.yml ps` and container logs.
            Every downstream service depends on this API for JWT verification.

      - alert: AuthApiHigh5xxRate
        expr: >-
          sum(rate(axum_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(axum_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "auth-api 5xx ratio above 5%"
          description: >-
            More than 5% of requests failed server-side over 5 minutes. Redis
            outage (rate limiter fails closed) and DB connectivity are the
            usual suspects - see the operations runbook.

      - alert: AuthApiArgon2Saturated
        # Not a single free Argon2 slot for 5 minutes: sign-ins and
        # registrations are queueing. Measured capacity is about 11-13
        # sign-ins per second per API core (docs/perf/performance-report.md);
        # beyond it, latency grows with the queue (8 s at 256 concurrent
        # sign-ins on 3 cores). Add an instance or cores.
        expr: max_over_time(argon2_queue_available_permits[5m]) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Argon2 saturated: sign-ins are queueing"
          description: >-
            Every Argon2 slot stayed busy for 5 minutes. Each queued sign-in
            waits for the ones ahead of it; scale out the API (each core adds
            about 12 sign-ins per second and needs ARGON2_MEMORY_KIB of RAM).

      - alert: AuthApiArgon2SaturatedLong
        expr: max_over_time(argon2_queue_available_permits[15m]) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Argon2 saturated for 15 minutes"
          description: >-
            Sign-in latency is now measured in seconds for every user. Scale
            out immediately; see "Capacity Planning" in the operations runbook.

      - alert: AuthApiSlowTokenPaths
        # Non-credential paths (refresh, profile) are single-digit ms; a slow
        # p95 across the board means something other than Argon2 is wrong.
        expr: >-
          histogram_quantile(0.95,
            sum(rate(axum_http_requests_duration_seconds_bucket[5m])) by (le)) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "auth-api p95 latency above 3s"
          description: >-
            Sustained slow responses; check DB pool saturation, Redis and the
            WireGuard link to the DB VPS.

      - alert: AuthBackupMissing
        # node_exporter's textfile collector on the DB VPS reads the metrics that
        # backup-db.sh writes after a complete backup only, offsite copy
        # included (--collector.textfile.directory=/var/lib/node_exporter/textfile).
        # absent(): a backup that never reported is as missing as a stale one.
        expr: >-
          (time() - auth_backup_last_success_timestamp > 86400 * 2)
            or absent(auth_backup_last_success_timestamp)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "no successful auth DB backup for 48h"
          description: >-
            The nightly encrypted backup, offsite copy included, has not
            completed for two days or has never reported. Check cron and
            /var/log/auth-api-backup.log on the DB VPS, and that node_exporter
            reads /var/lib/node_exporter/textfile.

      - alert: AuthBackupShrunk
        # A backup far smaller than those of the previous week usually means
        # a dump of the wrong database or a truncated one.
        expr: >-
          auth_backup_last_size_bytes
            < 0.5 * max_over_time(auth_backup_last_size_bytes[8d] offset 1d)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "the last auth DB backup is less than half the size of the previous ones"
          description: >-
            Compare the last files in /var/backups/auth-api on the DB VPS and
            restore the last one into a scratch database before trusting it.
