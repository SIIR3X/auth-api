        '415':
          description: Body is not JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: A dependency is unavailable or the request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /admin/users/{id}/roles/{name}:
    delete:
      tags:
      - admin
      operationId: unassign
      parameters:
      - name: id
        in: path
        description: Account id
        required: true
        schema:
          type: string
          format: uuid
      - name: name
        in: path
        description: Role name
        required: true
        schema:
          type: string
