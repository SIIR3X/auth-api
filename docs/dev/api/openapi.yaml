              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: A dependency is unavailable or the request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
components:
  schemas:
    AdminAuditEntry:
      allOf:
      - $ref: '#/components/schemas/AuditEntryResponse'
      - type: object
        properties:
          user_id:
            type:
            - string
            - 'null'
            format: uuid
            description: Absent once the account is deleted.
    AdminAuditPage:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditEntry'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass back as `cursor` to read the next page; absent on the last one.
    AdminUserDetail:
      allOf:
      - $ref: '#/components/schemas/AdminUserSummary'
      - type: object
        required:
        - roles
        - two_factor_methods
        - active_sessions
        properties:
          active_sessions:
            type: integer
            minimum: 0
          roles:
            type: array
            items:
              type: string
          two_factor_methods:
            type: integer
            description: Verified second factors.
            minimum: 0
    AdminUserPage:
      type: object
      required:
      - users
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass back as `cursor` to read the next page; absent on the last one.
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
    AdminUserSummary:
      type: object
      required:
      - id
      - username
      - email
      - status
      - preferred_locale
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        email:
          type: string
        email_verified_at:
          type:
          - integer
          - 'null'
          format: int64
        id:
          type: string
          format: uuid
        last_login_at:
          type:
          - integer
          - 'null'
          format: int64
        locked_until:
          type:
          - integer
          - 'null'
          format: int64
          description: Present while a sign-in lockout lasts.
        preferred_locale:
          type: string
        status:
          type: string
        username:
          type: string
    ApproveRequest:
      type: object
      required:
      - client_id
      - redirect_uri
      - code_challenge
      properties:
        client_id:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
        current_password:
          type:
          - string
          - 'null'
          description: Required for a non-primary client unless the session re-authenticated recently.
        redirect_uri:
          type: string
        state:
          type:
          - string
          - 'null'
          description: Opaque client value echoed in the redirect (CSRF protection, RFC 6749).
    ApproveResponse:
      type: object
      required:
      - redirect_to
      properties:
        redirect_to:
          type: string
          description: 'Where to send the browser: the redirect URI carrying `code` (and `state`).'
    AssignRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          type: string
    AuditEntryResponse:
      type: object
      required:
      - id
      - created_at
      - action
      - metadata
      properties:
        action:
          type: string
          description: 'Stable snake_case name: `login`, `password_changed`, ...'
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds), like every other timestamp of this API.
        id:
          type: string
          format: uuid
        ip_address:
          type:
          - string
          - 'null'
        metadata:
          type: object
        request_id:
          type:
          - string
          - 'null'
          format: uuid
    AuditPageResponse:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntryResponse'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass back as `cursor` to read the next page; absent on the last one.
    ChangeLocaleRequest:
      type: object
      required:
      - locale
      properties:
        locale:
          type: string
    ChangePasswordRequest:
      type: object
      required:
      - new_password
      properties:
        current_password:
          type:
          - string
          - 'null'
        keep_current_session:
          type: boolean
          description: |-
            Keep the session making the request signed in; every other session is
            revoked either way. Default: false.
        new_password:
          type: string
    ChangeUsernameRequest:
      type: object
      required:
      - username
      properties:
        current_password:
          type:
          - string
          - 'null'
        username:
          type: string
    ClientResponse:
      type: object
      required:
      - client_id
      - display_name
      - is_primary
      - scopes
      - redirect_uris
      - allows_loopback_redirect
      - default_max_sessions
      - created_at
      properties:
        allows_loopback_redirect:
          type: boolean
        client_id:
          type: string
        created_at:
          type: integer
          format: int64
        default_max_sessions:
          type: integer
          format: int32
        display_name:
          type: string
        is_primary:
          type: boolean
        redirect_uris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
          description: Permissions its tokens may carry; empty means every permission of the user.
    CompleteEmailTwoFactorRequest:
      type: object
      required:
      - pre_auth_token
      - code
      properties:
        code:
          type: string
        pre_auth_token:
          type: string
    CompleteMagicLinkRequest:
      type: object
      required:
      - token
      properties:
        device_name:
          type:
          - string
          - 'null'
        remember_me:
          type:
          - boolean
          - 'null'
          description: When true, issues a long-lived refresh token.
        token:
          type: string
          description: The token from the link's fragment.
    CompleteTwoFactorRequest:
      type: object
      required:
      - pre_auth_token
      - code
      properties:
        code:
          type: string
        pre_auth_token:
          type: string
    ConfirmNewEmailRequest:
      type: object
      required:
      - flow_token
      - code
      properties:
        code:
          type: string
        flow_token:
          type: string
    CreateRoleRequest:
      type: object
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    CurrentPasswordRequest:
      type: object
      description: |-
        Optional body for sensitive actions that accept the current password in
        place of a recent re-authentication.
      properties:
        current_password:
          type:
          - string
          - 'null'
    DeleteAccountRequest:
      type: object
      properties:
        current_password:
          type:
          - string
          - 'null'
    DescribeRequest:
      type: object
      required:
      - client_id
      - redirect_uri
      properties:
        client_id:
          type: string
        redirect_uri:
          type: string
    DescribeResponse:
      type: object
      required:
      - client_id
      - client_name
      - scopes
      - unrestricted
      - unavailable_scopes
      - sessions_used
      properties:
        client_id:
          type: string
        client_name:
          type: string
        scopes:
          type: array
          items:
            type: string
        sessions_allowed:
          type:
          - integer
          - 'null'
          format: int64
        sessions_used:
          type: integer
          format: int64
        unavailable_scopes:
          type: array
          items:
            type: string
        unrestricted:
          type: boolean
    DeviceAuthorizeRequest:
      type: object
      properties:
        client_id:
          type:
          - string
          - 'null'
          description: 'Registered client starting the flow. Omitted: the primary client.'
    DeviceInitResponse:
      type: object
      required:
      - device_code
      - user_code
      - verification_uri
      - expires_in
      - interval
      properties:
        device_code:
          type: string
        expires_in:
          type: integer
          format: int64
          minimum: 0
        interval:
          type: integer
          format: int64
          minimum: 0
        user_code:
          type: string
        verification_uri:
          type: string
    DevicePollResult:
      type: object
      required:
      - access_token
      - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    DevicePreview:
      type: object
      description: |-
        What the signed-in user is shown before approving a device. Nothing here is
        secret from the holder of the code; it is what lets them notice a code being
        claimed by an unexpected client or from an unexpected place.
      required:
      - user_code
      - created_at
      properties:
        client_id:
          type:
          - string
          - 'null'
        client_name:
          type:
          - string
          - 'null'
        created_at:
          type: integer
          format: int64
        requested_from_ip:
          type:
          - string
          - 'null'
        user_agent:
          type:
          - string
          - 'null'
        user_code:
          type: string
    DeviceTokenRequest:
      type: object
      required:
      - device_code
      properties:
        device_code:
          type: string
        device_name:
          type:
          - string
          - 'null'
          description: |-
            Label for the account's session list. Client-supplied, so a label and
            never an identity; it is normalized before it is stored.
    DeviceVerifyRequest:
      type: object
      required:
      - user_code
      properties:
        approve:
          type: boolean
        user_code:
          type: string
    DisableEmailOtpRequest:
      type: object
      properties:
        current_password:
          type:
          - string
          - 'null'
    DisableTotpRequest:
      type: object
      properties:
        current_password:
          type:
          - string
          - 'null'
    EmailOtpSetupResponse:
      type: object
      required:
      - method_id
      properties:
        method_id:
          type: string
          format: uuid
    ErrorBody:
      type: object
      description: Body of every error response.
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'Stable and machine-readable: `invalid_credentials`, `reauthentication_required`, ...'
        message:
          type: string
          description: Human-readable explanation; may change between versions.
    FlowTokenResponse:
      type: object
      required:
      - flow_token
      properties:
        flow_token:
          type: string
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        captcha_token:
          type:
          - string
          - 'null'
        email:
          type: string
    LoginRequest:
      type: object
      required:
      - identifier
      - password
      properties:
        captcha_token:
          type:
          - string
          - 'null'
        device_name:
          type:
          - string
          - 'null'
        identifier:
          type: string
        password:
          type: string
        remember_me:
          type:
          - boolean
          - 'null'
          description: |-
            When true, issues a long-lived refresh token (30 days).
            When false or omitted, issues a short-lived token (24 h).
    LoginResponse:
      oneOf:
      - type: object
        required:
        - access_token
        - refresh_token
        properties:
          access_token:
            type: string
          refresh_token:
            type: string
      - type: object
        required:
        - two_factor_required
        - two_factor_method
        - pre_auth_token
        properties:
          pre_auth_token:
            type: string
          two_factor_method:
            type: string
            description: '"totp" or "email"'
          two_factor_required:
            type: boolean
    MagicLinkRequest:
      type: object
      required:
      - email
      properties:
        captcha_token:
          type:
          - string
          - 'null'
        email:
          type: string
    PermissionResponse:
      type: object
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type: string
          description: '`resource:action`.'
    ReadyResponse:
      type: object
      description: What `/ready` found for each dependency.
      required:
      - status
      - database
      - redis
      - nats
      properties:
        database:
          type: string
          description: '`up` or `down`.'
        nats:
          type: string
        redis:
          type: string
        status:
          type: string
          description: '`ready` when every dependency answered, `unavailable` otherwise.'
    ReauthenticateRequest:
      type: object
      required:
      - current_password
      properties:
        current_password:
          type: string
    RecoveryCodesResponse:
      type: object
      required:
      - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: Plaintext recovery codes shown once. The user must store them securely.
    RecoveryLoginRequest:
      type: object
      required:
      - pre_auth_token
      - recovery_code
      properties:
        pre_auth_token:
          type: string
        recovery_code:
          type: string
    RedeemRequest:
      type: object
      required:
      - code
      - code_verifier
      - client_id
      - redirect_uri
      properties:
        client_id:
          type: string
        code:
          type: string
        code_verifier:
          type: string
        device_name:
          type:
          - string
          - 'null'
        redirect_uri:
          type: string
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    RegenerateRecoveryCodesRequest:
      type: object
      properties:
        current_password:
          type:
          - string
          - 'null'
    RegisterRequest:
      type: object
      required:
      - username
      - email
      - password
      properties:
        captcha_token:
          type:
          - string
          - 'null'
          description: hCaptcha token from the frontend widget. Required when CAPTCHA_SECRET is configured.
        email:
          type: string
        locale:
          type:
          - string
          - 'null'
        password:
          type: string
        username:
          type: string
    RegistrationAccepted:
      type: object
      description: |-
        Registration answer. Identical whether the address was free or already had
        an account, so it cannot be used to enumerate accounts.
      required:
      - status
      - message
      properties:
        message:
          type: string
        status:
          type: string
    ResendEmailTwoFactorRequest:
      type: object
      required:
      - pre_auth_token
      properties:
        pre_auth_token:
          type: string
    ResendVerificationRequest:
      type: object
      required:
      - email
      properties:
        captcha_token:
          type:
          - string
          - 'null'
        email:
          type: string
    ResetPasswordRequest:
      type: object
      required:
      - token
      - new_password
      properties:
        new_password:
          type: string
        token:
          type: string
    RevokeAllRequest:
      type: object
      properties:
        current_password:
          type:
          - string
          - 'null'
        keep_current_session:
          type: boolean
          description: 'Keep the session making the request signed in. Default: false.'
    RevokedSessionsResponse:
      type: object
      required:
      - revoked
      properties:
        revoked:
          type: integer
          format: int64
          minimum: 0
    RolePermissionsRequest:
      type: object
      required:
      - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
    RoleResponse:
      type: object
      required:
      - name
      - is_default
      - permissions
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        description:
          type:
          - string
          - 'null'
        is_default:
          type: boolean
          description: Given to every new account.
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    SaveClientRequest:
      type: object
      required:
      - display_name
      properties:
        allows_loopback_redirect:
          type: boolean
        default_max_sessions:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Default: 5.'
        display_name:
          type: string
        is_primary:
          type: boolean
        redirect_uris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
    SessionResponse:
      type: object
      required:
      - id
      - session_type
      - last_used_at
      - expires_at
      - created_at
      - is_current
      properties:
        client_id:
          type:
          - string
          - 'null'
        created_at:
          type: integer
          format: int64
        device_name:
          type:
          - string
          - 'null'
        expires_at:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
        ip_address:
          type:
          - string
          - 'null'
        is_current:
          type: boolean
          description: True when this is the session used to make the current request.
        last_used_at:
          type: integer
          format: int64
        session_type:
          $ref: '#/components/schemas/SessionType'
        user_agent:
          type:
          - string
          - 'null'
    SessionType:
      type: string
      enum:
      - web
      - device
    SetupTwoFactorRequest:
      type: object
      description: |-
        Body of the setup endpoints. Optional: a recent re-authentication
        (`POST /users/me/reauth`) makes the password unnecessary.
      properties:
        current_password:
          type:
          - string
          - 'null'
    SubmitNewEmailRequest:
      type: object
      required:
      - flow_token
      - new_email
      properties:
        flow_token:
          type: string
        new_email:
          type: string
    TokenResponse:
      type: object
      required:
      - access_token
      - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    TokensResponse:
      type: object
      required:
      - access_token
      - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    TotpSetupResponse:
      type: object
      required:
      - method_id
      - qr_uri
      - base32_secret
      properties:
        base32_secret:
          type: string
          description: Base32 secret shown once so the user can manually enter it in their app.
        method_id:
          type: string
          format: uuid
        qr_uri:
          type: string
    TwoFactorMethodResponse:
      type: object
      required:
      - id
      - method_type
      - is_verified
      - is_primary
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
        is_primary:
          type: boolean
        is_verified:
          type: boolean
        last_used_at:
          type:
          - integer
          - 'null'
          format: int64
        method_type:
          type: string
          description: '`totp` or `email`.'
    TwoFactorOverviewResponse:
      type: object
      required:
      - methods
      - recovery_codes_remaining
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/TwoFactorMethodResponse'
        recovery_codes_remaining:
          type: integer
          format: int64
          description: |-
            Unused and unexpired. Zero next to a verified method is worth showing:
            losing the device would then lock the account.
    UseRecoveryCodeRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    UserResponse:
      type: object
      required:
      - id
      - username
      - email
      - status
      - preferred_locale
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        email:
          type: string
        email_verified_at:
          type:
          - integer
          - 'null'
          format: int64
        id:
          type: string
          format: uuid
        last_login_at:
          type:
          - integer
          - 'null'
          format: int64
        preferred_locale:
          type: string
        status:
          type: string
        username:
          type: string
    VerifyCurrentEmailRequest:
      type: object
      required:
      - flow_token
      - code
      properties:
        code:
          type: string
        flow_token:
          type: string
    VerifyEmailOtpSetupRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    VerifyEmailRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
    VerifyTotpSetupRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: discovery
  description: Health and public keys
- name: auth
  description: Registration, sign-in, tokens and two-factor challenges
- name: device
  description: Device authorization flow (RFC 8628)
- name: authorize
  description: Authorization code flow with PKCE (RFC 7636)
- name: account
  description: The caller's profile, security history and re-authentication
- name: email-change
  description: Changing the account's email address
- name: sessions
  description: Active sessions
- name: two-factor
  description: Second factors and recovery codes
- name: admin
  description: 'Administration: accounts, roles, client applications and the audit log. Requires the permission of each operation and a second factor'
