openapi: 3.1.0
info:
  title: Auth API
  description: 'Authentication API: accounts, sessions, second factors and client applications. Issues ES256 access tokens and rotating refresh tokens, and publishes the JWKS resource servers verify them with.'
  license:
    name: MIT
  version: 0.1.0
servers:
- url: http://localhost:3000
  description: Local development
paths:
  /.well-known/jwks.json:
    get:
      tags:
      - discovery
      operationId: jwks
      responses:
        '200':
          description: JSON Web Key Set of the current and previous signing keys
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: A dependency is unavailable or the request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /admin/audit:
    get:
      tags:
      - admin
      operationId: list
      parameters:
      - name: user_id
        in: query
        description: Only this account's entries
        required: false
        schema:
          type: string
          format: uuid
      - name: action
        in: query
        description: Only this action
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Entries per page, 1-200 (default 50)
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: next_cursor of the previous page
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditPage'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing, invalid or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Missing `audit:read`, or no second factor enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid cursor or account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: A dependency is unavailable or the request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /admin/clients:
    get:
      tags:
      - admin
      operationId: list
      responses:
        '200':
          description: Every registered client
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponse'
        '401':
          description: Missing, invalid or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Missing `clients:manage`, or no second factor enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: A dependency is unavailable or the request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /admin/clients/{client_id}:
    put:
      tags:
      - admin
      operationId: save
      parameters:
      - name: client_id
        in: path
        description: Client id, 1 to 100 of [A-Za-z0-9._-]
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveClientRequest'
        required: true
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '201':
          description: Client registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing, invalid or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Missing `clients:manage`, no second factor, or re-authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: '`primary_client_exists`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: Body larger than 64 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '415':
          description: Body is not JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid settings or unknown scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: A dependency is unavailable or the request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
    delete:
      tags:
      - admin
      operationId: delete
      parameters:
      - name: client_id
        in: path
        description: Client id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Client removed and its sessions revoked
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing, invalid or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Missing `clients:manage`, or no second factor enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: A dependency is unavailable or the request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /admin/permissions:
    get:
      tags:
      - admin
      operationId: permissions
      responses:
        '200':
          description: Every permission a role can grant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
        '401':
          description: Missing, invalid or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Missing `roles:manage`, or no second factor enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: A dependency is unavailable or the request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearer: []
  /admin/roles:
    get:
      tags:
      - admin
      operationId: list
