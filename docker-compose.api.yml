# Production stack of the API VPS: two API instances behind the host's nginx
# (upstream 127.0.0.1:3001 and 127.0.0.1:3002) and the NATS event broker.
#
# Sizing comes from a profile passed with --env-file (deploy/profiles/s.env,
# m.env or l.env): CPU and memory per instance, Argon2 concurrency, pool sizes,
# broker limits. Secrets are exported from pass and written to root-only files
# by scripts/write-secrets.sh before running (see docs/deploy/guides/update.md). scripts/rolling-update.sh replaces the
# instances one at a time, so an update never stops the service.

x-api: &api
  # Built by `make release` and loaded on the server.
  image: auth-api:${AUTH_API_VERSION:?set AUTH_API_VERSION to the release being deployed}
  env_file: config.prod.env
  environment:
    # Secrets are files written by scripts/write-secrets.sh and mounted below:
    # each variable X is read from the file named by X_FILE, so the values
    # appear neither in `docker inspect` nor in the process environment. An
    # optional secret (a rotation's previous or next key) is an empty file
    # outside a rotation.
    DATABASE_URL_FILE: /run/secrets/database_url
    REDIS_URL_FILE: /run/secrets/redis_url
    JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
    JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
    JWT_PREVIOUS_PUBLIC_KEY_FILE: /run/secrets/jwt_previous_public_key
    JWT_NEXT_PUBLIC_KEY_FILE: /run/secrets/jwt_next_public_key
    ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    PREVIOUS_ENCRYPTION_KEY_FILE: /run/secrets/previous_encryption_key
    SMTP_USERNAME_FILE: /run/secrets/smtp_username
    SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    CAPTCHA_SECRET_FILE: /run/secrets/captcha_secret
    # nats://<token>@nats:4222, the token of nats-auth.conf.
    NATS_URL_FILE: /run/secrets/nats_url
    # Bearer token of the internal listener, given to Prometheus too.
    METRICS_TOKEN_FILE: /run/secrets/metrics_token
    # Sizing, from the profile.
    ARGON2_MAX_CONCURRENCY: ${ARGON2_MAX_CONCURRENCY:?pass a profile with --env-file}
    DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:?pass a profile with --env-file}
    REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:?pass a profile with --env-file}
  secrets:
    - database_url
    - redis_url
    - jwt_private_key
    - jwt_public_key
    - jwt_previous_public_key
    - jwt_next_public_key
    - encryption_key
    - previous_encryption_key
    - smtp_username
    - smtp_password
    - captcha_secret
    - nats_url
    - metrics_token
  restart: unless-stopped
  # The app writes nothing to disk (logs go to stdout, templates are read-only),
  # needs no Linux capability and must not gain privileges.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  # Longer than the shutdown drain (32 s of requests, 5 s of background tasks,
  # 2 s of NATS flush): Docker never kills a draining instance.
  stop_grace_period: 40s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  deploy:
    resources:
      # Memory: 64 MiB per concurrent Argon2 hash plus 256 MiB for the rest
      # (docs/deploy/guides/operations.md, section 9).
      limits:
        cpus: "${API_CPUS:?pass a profile with --env-file}"
        memory: ${API_MEMORY:?pass a profile with --env-file}
        pids: 256
      reservations:
        memory: ${API_MEMORY_RESERVATION:?pass a profile with --env-file}
  healthcheck:
    # The binary calls its own /live: the distroless image has no curl.
    test: ["CMD", "./auth-api", "--healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s
  depends_on:
    nats:
      condition: service_healthy
  networks:
    - auth-api

services:
  api-a:
    <<: *api
    ports:
      # The API on loopback, reached through nginx (which sets
      # X-Forwarded-For). Metrics on the WireGuard address, scraped by the
      # monitoring host (METRICS_BIND_ADDRESS, 10.0.0.1 by default).
      - "127.0.0.1:3001:3000"
      - "${METRICS_BIND_ADDRESS:-10.0.0.1}:9465:9464"

  api-b:
    <<: *api
    ports:
      - "127.0.0.1:3002:3000"
      - "${METRICS_BIND_ADDRESS:-10.0.0.1}:9466:9464"

  # Domain-event broker. No host port: only the API instances reach it, over the
  # compose network, and the token is required on top of that isolation.
  nats:
    image: nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    # Limits and JetStream live in nats.conf; the token in a file mounted as a
    # secret, so it appears neither in the process arguments nor in
    # `docker inspect`.
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      GOMEMLIMIT: ${NATS_GOMEMLIMIT:?pass a profile with --env-file}
    volumes:
      # JetStream keeps the durable user events (`user.deleted`) on a named
      # volume: a tmpfs would lose unconsumed erasure events on restart.
      - nats_data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    secrets:
      - source: nats_auth
        target: /etc/nats/auth.conf
    # The exporter shares this network namespace to read the monitoring
    # endpoint, which listens on loopback only: its port is published here.
    ports:
      - "${METRICS_BIND_ADDRESS:-10.0.0.1}:7777:7777"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${NATS_CPUS:?pass a profile with --env-file}"
          memory: ${NATS_MEMORY:?pass a profile with --env-file}
          pids: 128
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - auth-api

  # NATS metrics for the monitoring host: connections, JetStream storage.
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.2@sha256:c623b608e148e31e1c1c878673a197f1828e58ce90de4f01d22f1baa84c8fee9
    restart: unless-stopped
    command: ["-varz", "-jsz=all", "http://127.0.0.1:8222"]
    # In the broker's network namespace: the monitoring endpoint is not on the
    # compose network, where any container could read connections and streams.
    network_mode: "service:nats"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M
          pids: 32
    depends_on:
      nats:
        condition: service_healthy

secrets:
  # The application's secrets (scripts/write-secrets.sh).
  database_url:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/database_url
  redis_url:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/redis_url
  jwt_private_key:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/jwt_private_key
  jwt_public_key:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/jwt_public_key
  jwt_previous_public_key:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/jwt_previous_public_key
  jwt_next_public_key:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/jwt_next_public_key
  encryption_key:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/encryption_key
  previous_encryption_key:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/previous_encryption_key
  smtp_username:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/smtp_username
  smtp_password:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/smtp_password
  captcha_secret:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/captcha_secret
  nats_url:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/nats_url
  metrics_token:
    file: ${AUTH_API_SECRETS_DIR:-/etc/auth-api/secrets}/metrics_token
  nats_auth:
    # authorization { token: "..." }, written from pass, mode 0600
    # (docs/deploy/api/secrets.md).
    file: ./nats-auth.conf

volumes:
  nats_data:

# A fixed subnet makes the trusted proxy address predictable. The host's nginx
# reaches the published loopback ports through Docker's port proxy, so the
# application sees the bridge gateway (172.30.0.1) as its peer - not
# 127.0.0.1. TRUSTED_PROXY_CIDRS in config.prod.env must name that gateway,
# or X-Forwarded-For is ignored and every client shares one rate-limit bucket.
# Any process on the host could send a forged X-Forwarded-For through those
# ports, or straight to the instances on this subnet: the rule of
# deploy/api/nftables-auth-api.conf lets only nginx and root through both.
networks:
  auth-api:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
