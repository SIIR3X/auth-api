[package]
name = "auth-api-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Verify auth-api access tokens in a Rust resource server: JWKS, issuer, audience, permissions, and optional revocation checks."
license = "MIT"

[features]
default = []
# `Authenticated` extractor for axum handlers.
axum = ["dep:axum"]

[dependencies]
axum = { version = "0.8.8", optional = true, default-features = false }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["sync", "time"] }
uuid = { version = "1.22.0", features = ["serde"] }

[dev-dependencies]
auth-api-verifier = { path = ".", features = ["axum"] }
auth-api = { path = "../.." }
axum = "0.8.8"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
testkit = { path = "../testkit" }
tokio = { version = "1.50.0", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
