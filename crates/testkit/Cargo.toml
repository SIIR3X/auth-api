[package]
name = "testkit"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Shared harness of the auth-api test suites: test app, databases, clock, mail capture, fault injection."

[dependencies]
anyhow = "1.0.102"
auth-api = { path = "../.." }
axum = "0.8.8"
base64 = "0.23.1"
ciborium = "0.2.2"
deadpool-redis = "0.23.0"
dotenvy = "0.15.7"
jsonschema = { version = "0.56.0", default-features = false }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
lettre = { version = "0.11.19", default-features = false, features = ["builder"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate"] }
time = "0.3.47"
tokio = { version = "1.50.0", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = "5"
uuid = { version = "1.22.0", features = ["v4"] }
