# NATS broker of the API VPS (docker-compose.api.yml).

# Monitoring endpoint, probed by the health check and scraped by the exporter.
# Not published on the host.
http_port: 8222

# Durable user events. Memory store unused by the API; the file store is capped
# well above the stream's own ceiling (256 MiB, 30 days).
jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 1GB
}

# Limits for a broker with a handful of clients.
max_connections: 64
max_payload: 1MB

# authorization { token: "..." }, mounted as a compose secret next to this
# file: an include path is relative to the including file's directory.
include auth.conf
